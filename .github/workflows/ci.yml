name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API typecheck
        run: pnpm --filter @amauc/api typecheck

      - name: Run API tests
        run: pnpm --filter @amauc/api test

      - name: Run full monorepo test suite (shared build/test + mobile tests)
        run: pnpm exec turbo run test

      - name: Run mobile typecheck
        run: pnpm exec turbo run typecheck